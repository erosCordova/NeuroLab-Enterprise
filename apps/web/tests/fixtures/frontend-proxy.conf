# CI only: approximate Vercel static hosting and its external /api rewrite.
events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 4189;
        root /usr/share/nginx/html;
        index index.html;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:" always;
        location /api/ {
            proxy_pass http://127.0.0.1:4190;
            proxy_set_header Origin $http_origin;
            proxy_set_header Host $host;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
