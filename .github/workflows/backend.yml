name: Validar API y PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neurolab_test
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: neurolab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurolab_test -d neurolab_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgresql://neurolab_test:ephemeral_ci_password@localhost:5432/neurolab_test
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
