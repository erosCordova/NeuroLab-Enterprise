name: Comprobar entrenamiento CNN real
on:
  pull_request:
    paths:
      - 'services/api/app/real_cnn.py'
      - 'services/api/tests/test_real_cnn.py'
      - 'services/api/requirements-ml.txt'
      - '.github/workflows/cnn-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrenamiento-tensorflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-ml.txt
      - name: Instalar entorno ML independiente
        run: python -m pip install -r requirements-ml.txt pytest==8.3.5
      - name: Ejecutar entrenamiento real y pruebas
        run: python -m pytest -q tests/test_real_cnn.py --tb=short
